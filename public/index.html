<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>VibeTrade AI Dashboard</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 380px;
        }
        h1 { font-size: 24px; margin: 0 0 20px; color: #00e676; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
        }
        .status {
            margin: 15px 0 0;
            padding: 10px;
            border-radius: 6px;
            background-color: #2a2a2a;
            font-size: 14px;
            word-break: break-word;
        }
        button {
            background-color: #00e676;
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease;
            width: 100%;
        }
        button:hover { background-color: #00c853; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .sell { background-color: #ff5252; color: #fff; }
        .sell:hover { background-color: #e53935; }
        .row { display: flex; gap: 10px; }
        .link { background: none; color: #aaa; font-weight: normal; font-size: 14px; margin-top: 14px; padding: 6px; }
        .link:hover { background: none; color: #fff; }
        .acct { text-align: left; background: #2a2a2a; border-radius: 8px; padding: 12px; font-size: 14px; line-height: 1.6; margin-bottom: 14px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .demo { background: #2e7d32; }
        .live { background: #c62828; }
        .hidden { display: none; }
        label { display: block; text-align: left; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
        }
        .chat { margin-top: 18px; border-top: 1px solid #333; padding-top: 14px; }
        .chat button { background-color: #3a3a3a; color: #fff; font-size: 14px; padding: 10px; }
        .chat button:hover { background-color: #4a4a4a; }
        .reply { text-align: left; font-size: 13px; line-height: 1.5; color: #ddd; margin-top: 10px; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h1>VibeTrade AI Dashboard</h1>

    <!-- LOGIN VIEW -->
    <div id="loginView">
        <div id="brokerBox" class="hidden">
            <label for="broker">Market</label>
            <select id="broker"></select>
        </div>
        <label for="access">Access code</label>
        <input id="access" type="password" placeholder="Your ACCESS_CODE" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')doLogin()">
        <button id="loginBtn" onclick="doLogin()">Log in</button>
    </div>

    <!-- TRADING VIEW -->
    <div id="tradeView" class="hidden">
        <div class="acct" id="acct"></div>

        <label for="symbol">Market / symbol</label>
        <input id="symbol" type="text" value="EURUSD" autocapitalize="off" autocorrect="off">
        <label for="volume" id="sizeLabel">Volume (lots)</label>
        <input id="volume" type="number" step="any" min="0" value="0.01">
        <div id="durationBox" class="hidden">
            <label for="duration">Duration (minutes)</label>
            <input id="duration" type="number" step="1" min="1" max="1440" value="5">
        </div>

        <div class="row">
            <button id="buyBtn" onclick="sendSignal('buy')">BUY</button>
            <button id="sellBtn" class="sell" onclick="sendSignal('sell')">SELL</button>
        </div>

        <div class="chat">
            <label for="question">Ask the AI (optional)</label>
            <input id="question" type="text" maxlength="1000" placeholder="e.g. What is a stop loss?"
                   onkeydown="if(event.key==='Enter')askAI()">
            <button id="askBtn" onclick="askAI()">Ask</button>
            <div id="reply" class="reply"></div>
        </div>

        <button class="link" onclick="doLogout()">Log out</button>
    </div>

    <div id="status" class="status">Status: Please log in</div>
</div>

<script>
    let isDemo = true;
    let brokers = [];
    const $ = id => document.getElementById(id);

    async function loadConfig() {
        try {
            const res = await fetch('/config');
            const cfg = await res.json();
            brokers = cfg.brokers || [];
            const sel = $('broker');
            sel.innerHTML = '';
            brokers.forEach(b => {
                const o = document.createElement('option');
                o.value = b.id;
                o.textContent = b.label;
                sel.appendChild(o);
            });
            if (cfg.default) sel.value = cfg.default;
            $('brokerBox').classList.toggle('hidden', brokers.length < 2);
            applyBroker(sel.value);
        } catch (e) {}
    }

    function applyBroker(id) {
        const b = brokers.find(x => x.id === id);
        if (!b) return;
        sessionStorage.setItem('broker', id);
        $('sizeLabel').innerText = b.size_label;
        $('symbol').value = b.default_symbol;
        $('buyBtn').innerText = b.buy_label;
        $('sellBtn').innerText = b.sell_label;
        $('durationBox').classList.toggle('hidden', !b.needs_duration);
        $('volume').value = id === 'metaapi' ? '0.01' : id === 'deriv' ? '1' : '0.001';
    }

    function api(path, options = {}) {
        options.headers = Object.assign(
            {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + (sessionStorage.getItem('token') || '')
            },
            options.headers || {}
        );
        return fetch(path, options);
    }

    function setStatus(text, color) {
        const s = $('status');
        s.innerText = text;
        s.style.color = color;
    }

    function showView(loggedIn) {
        $('loginView').classList.toggle('hidden', loggedIn);
        $('tradeView').classList.toggle('hidden', !loggedIn);
    }

    function renderAccount(a) {
        isDemo = a.demo;
        const badge = a.demo
            ? '<span class="badge demo">DEMO</span>'
            : '<span class="badge live">LIVE</span>';
        const safe = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        $('acct').innerHTML =
            `${badge} <b>${safe(a.name || 'Account')}</b><br>` +
            `#${safe(a.login)} &middot; ${safe(a.server)}<br>` +
            `Balance: ${Number(a.balance).toFixed(2)} ${safe(a.currency)}<br>` +
            `Equity: ${Number(a.equity).toFixed(2)} ${safe(a.currency)}`;
    }

    async function doLogin() {
        const btn = $('loginBtn');
        btn.disabled = true;
        setStatus('Connecting...', '#ffeb3b');
        try {
            const res = await api('/login', {
                method: 'POST',
                body: JSON.stringify({ access_code: $('access').value, broker: $('broker').value })
            });
            const data = await res.json();
            if (data.status === 'success') {
                sessionStorage.setItem('token', data.token);
                applyBroker(data.broker);
                $('access').value = '';
                renderAccount(data.account);
                showView(true);
                setStatus('Connected', '#00e676');
            } else {
                setStatus(data.message, '#ff5252');
            }
        } catch (e) {
            console.error(e);
            setStatus('Cannot reach the server. If it was asleep, wait a minute and try again.', '#ff5252');
        } finally {
            btn.disabled = false;
        }
    }

    async function doLogout() {
        try { await api('/logout', { method: 'POST' }); } catch (e) {}
        sessionStorage.removeItem('token');
        showView(false);
        setStatus('Logged out', '#aaa');
    }

    async function refreshAccount() {
        const res = await api('/account');
        if (res.status === 401 || res.status === 503) throw new Error('session');
        const data = await res.json();
        renderAccount(data.account);
    }

    async function sendSignal(side) {
        const symbol = $('symbol').value.trim();
        const volume = parseFloat($('volume').value);
        const duration = parseInt($('duration').value, 10) || 5;

        if (!symbol || !(volume > 0)) {
            setStatus('Enter a market and a size', '#ff5252');
            return;
        }
        if (!isDemo && !confirm(`LIVE ACCOUNT: ${side.toUpperCase()} ${volume} ${symbol}?`)) return;

        $('buyBtn').disabled = $('sellBtn').disabled = true;
        setStatus('Sending order...', '#ffeb3b');

        try {
            const res = await api('/execute', {
                method: 'POST',
                body: JSON.stringify({ side, symbol, volume, duration })
            });
            const data = await res.json();

            if (res.status === 401) {
                sessionStorage.removeItem('token');
                showView(false);
                setStatus('Session expired, log in again', '#ff5252');
            } else if (data.status === 'success') {
                setStatus(`Order #${data.order} sent @ ${data.price}`, '#00e676');
                refreshAccount().catch(() => {});
            } else {
                setStatus(`Failed: ${data.message}`, '#ff5252');
            }
        } catch (e) {
            console.error(e);
            setStatus('Cannot reach the server. Try again in a moment.', '#ff5252');
        } finally {
            $('buyBtn').disabled = $('sellBtn').disabled = false;
        }
    }

    async function askAI() {
        const q = $('question').value.trim();
        if (!q) return;
        $('askBtn').disabled = true;
        $('reply').innerText = 'Thinking...';
        try {
            const res = await api('/chat', { method: 'POST', body: JSON.stringify({ message: q }) });
            const data = await res.json();
            if (res.status === 401) {
                sessionStorage.removeItem('token');
                showView(false);
                setStatus('Session expired, log in again', '#ff5252');
            } else {
                $('reply').innerText = data.status === 'success' ? data.reply : data.message;
            }
        } catch (e) {
            $('reply').innerText = 'Cannot reach the server.';
        } finally {
            $('askBtn').disabled = false;
        }
    }

    // Resume the session if the server still has it
    (async function init() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
        await loadConfig();
        if (!sessionStorage.getItem('token')) return;
        try {
            applyBroker(sessionStorage.getItem('broker') || $('broker').value);
            await refreshAccount();
            showView(true);
            setStatus('Connected', '#00e676');
        } catch (e) {
            sessionStorage.removeItem('token');
        }
    })();
</script>

</body>
</html>
